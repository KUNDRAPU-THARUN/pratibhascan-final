[versions]
agp = "9.3.1"
ksp = "2.3.10"
coreKtx = "1.18.0"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
appcompat = "1.7.1"
material = "1.13.0"
activityKtx = "1.13.0"
fragmentKtx = "1.8.6"
navigation = "2.8.8"
lifecycle = "2.9.0-alpha11"
coil = "2.7.0"
shimmer = "0.5.0"
constraintlayout = "2.2.1"
room = "2.8.4"
mediapipe = "0.10.35"
mlkitText = "16.0.0"
camerax = "1.4.1"
swiperefreshlayout = "1.1.0"
arcore = "1.48.0"
kotlin = "2.3.10"
